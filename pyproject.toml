[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-journey"
version = "0.1.0"
description = "Build Your Agent. Level Up Your Engineering Skills. 从零构建 Mini Coding Agent Runtime 的九关学习之旅"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# flat-layout 下显式列出 Python 包,避免 setuptools 误吞 content/、docs/ 等目录
[tool.setuptools]
packages = ["agent", "tools", "runtime", "sandbox", "orchestration", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: 真实 API 集成用例(需 ANTHROPIC_API_KEY,未设置时 skip)",
]
