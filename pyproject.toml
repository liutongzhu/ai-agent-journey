[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-journey"
version = "0.1.0"
description = "Build Your Agent. Level Up Your Engineering Skills. 从零构建 Mini Coding Agent Runtime 的九关学习之旅"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
